<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>떠돌이 글씨</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #111; cursor: default; }
  .typing {
    position: fixed; left: 0; top: 0; transform: translate(-50%, -50%);
    font-size: clamp(32px, 4.4vw, 64px); line-height: 1; white-space: pre; display: flex; align-items: center;
    pointer-events: none;
  }
  .caret { width: 3px; height: 0.9em; background: #111; margin-left: 4px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .word {
    position: fixed; left: 0; top: 0; font-size: clamp(24px, 3.3vw, 48px); line-height: 1; white-space: pre;
    will-change: transform; pointer-events: none;
  }
  img.word { width: clamp(120px, 16vw, 240px); height: auto; display: block; }
  #input { position: fixed; left: -9999px; top: 0; opacity: 0; }
  #trash {
    position: fixed; left: 16px; bottom: 16px; z-index: 10;
    width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent;
    display: grid; place-items: center; cursor: pointer; color: #999;
  }
  #trash:hover { color: #111; background: #f2f2f2; }
  #trash:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
  #setup { position: fixed; left: 72px; bottom: 28px; font-size: 14px; color: #c00; }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
</style>
</head>
<body>
<textarea id="input" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<button id="trash" type="button" aria-label="모든 글씨 지우기" title="모든 글씨 지우기">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
  </svg>
</button>
<div id="setup" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAz-_uEjH4cB0dyIT7lU5VBtdeTCsIq5-0",
  authDomain: "typo-4054b.firebaseapp.com",
  databaseURL: "https://typo-4054b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "typo-4054b",
  storageBucket: "typo-4054b.firebasestorage.app",
  messagingSenderId: "73259347629",
  appId: "1:73259347629:web:d17537f3b3e02f98236024"
};

(() => {
  const LIFETIME = 145;    // 단어·그림이 사라지기까지 초 (2분 25초)
  const MAX_WORDS = 300;   // 동시에 불러올 최대 개수 (과부하 방지)
  const MAX_LEN = 60;      // 단어 하나 최대 길이
  const IMG_MAX = 480;     // 붙여넣은 그림을 줄일 최대 가로·세로(px)

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const input = document.getElementById('input');
  const trash = document.getElementById('trash');
  const myId = Math.random().toString(36).slice(2, 10);

  // 다른 사람 화면에 보일 내 커서 위치: 가운데(내 자리처럼 보이는 곳)를 피해서 랜덤
  let px, py;
  do { px = 0.15 + Math.random() * 0.7; py = 0.15 + Math.random() * 0.7; }
  while (Math.hypot(px - 0.5, py - 0.5) < 0.22);
  const me = { x: px, y: py, text: '' };

  // 서버 시간 보정 (움직임·소멸 타이밍을 모두 같게)
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  const now = () => Date.now() + offset;

  // ---------- 내 커서 ----------
  const myRef = db.ref('cursors/' + myId);
  const syncMe = () => myRef.set({ x: me.x, y: me.y, text: me.text });
  db.ref('.info/connected').on('value', s => {
    if (!s.val()) return;
    myRef.onDisconnect().remove();
    syncMe();
  });

  const focus = () => input.focus({ preventScroll: true });
  addEventListener('pointerdown', e => { e.preventDefault(); focus(); });
  addEventListener('keydown', () => { if (document.activeElement !== input) focus(); });
  focus();

  function onInput(e) {
    let v = input.value;
    if (!e.isComposing && /\s/.test(v)) {
      const cut = Math.max(v.lastIndexOf(' '), v.lastIndexOf('\n'), v.lastIndexOf('\t'));
      v.slice(0, cut).split(/\s+/).filter(Boolean).forEach(t => release({ text: t.slice(0, MAX_LEN) }));
      v = v.slice(cut + 1);
      input.value = v;
    }
    if (v.length > MAX_LEN) { v = v.slice(0, MAX_LEN); input.value = v; }
    me.text = v;
    syncMe();
  }
  input.addEventListener('input', onInput);
  input.addEventListener('compositionend', () => onInput({ isComposing: false }));

  function release(extra) {
    db.ref('words').push(Object.assign({
      owner: myId,
      x: me.x, y: me.y,
      ang: Math.random() * Math.PI * 2,
      speed: 0.04 + Math.random() * 0.05,
      wob: Math.random() * Math.PI * 2,
      rot: 6 + Math.random() * 14,
      born: firebase.database.ServerValue.TIMESTAMP
    }, extra));
  }

  // ---------- 그림 붙여넣기 ----------
  addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (!item) return;
    e.preventDefault();
    const blob = item.getAsFile(); if (!blob) return;
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, IMG_MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      release({ img: c.toDataURL('image/jpeg', 0.8) });
    };
    img.src = url;
  });

  // ---------- 쓰레기통: 모두의 화면에서 전부 지우기 ----------
  trash.addEventListener('click', () => {
    db.ref('words').remove();
    db.ref('clearAt').set(firebase.database.ServerValue.TIMESTAMP);
  });
  let firstClear = true;
  db.ref('clearAt').on('value', () => {
    if (firstClear) { firstClear = false; return; }
    input.value = ''; me.text = ''; syncMe();
  });

  // ---------- 커서 그리기 (내 커서는 항상 내 화면 가운데) ----------
  const cursorEls = new Map();
  function upsertCursor(id, d) {
    if (!d) return;
    let c = cursorEls.get(id);
    if (!c) {
      const el = document.createElement('div');
      el.className = 'typing';
      el.innerHTML = '<span class="t"></span><span class="caret"></span>';
      document.body.appendChild(el);
      c = { el, t: el.firstChild };
      cursorEls.set(id, c);
    }
    c.id = id; c.d = d;
    c.t.textContent = typeof d.text === 'string' ? d.text : '';
    placeCursor(c);
  }
  const posOf = (owner, x, y) => owner === myId ? [0.5, 0.5] : [x, y];
  const placeCursor = c => {
    const [x, y] = posOf(c.id, c.d.x, c.d.y);
    c.el.style.left = (x * innerWidth) + 'px'; c.el.style.top = (y * innerHeight) + 'px';
  };
  const cursors = db.ref('cursors');
  cursors.on('child_added', s => upsertCursor(s.key, s.val()));
  cursors.on('child_changed', s => upsertCursor(s.key, s.val()));
  cursors.on('child_removed', s => { const c = cursorEls.get(s.key); if (c) { c.el.remove(); cursorEls.delete(s.key); } });
  addEventListener('resize', () => cursorEls.forEach(placeCursor));

  // ---------- 떠도는 단어·그림 ----------
  const words = new Map();
  const removeWord = key => { const w = words.get(key); if (w) { w.el.remove(); words.delete(key); } };
  const wref = db.ref('words').limitToLast(MAX_WORDS);
  wref.on('child_added', s => {
    const d = s.val(); if (!d) return;
    let el;
    if (typeof d.img === 'string' && d.img.startsWith('data:image/')) {
      el = document.createElement('img'); el.className = 'word'; el.alt = ''; el.src = d.img;
    } else if (typeof d.text === 'string') {
      el = document.createElement('span'); el.className = 'word'; el.textContent = d.text;
      if (d.text === '사랑해') el.style.color = '#e60023';   // '사랑해'만 빨간색
    } else return;
    document.body.appendChild(el);
    const w = { el, d, w: el.offsetWidth, h: el.offsetHeight };
    if (el.tagName === 'IMG') el.onload = () => { w.w = el.offsetWidth; w.h = el.offsetHeight; };
    words.set(s.key, w);
  });
  wref.on('child_removed', s => removeWord(s.key));
  addEventListener('resize', () => words.forEach(w => { w.w = w.el.offsetWidth; w.h = w.el.offsetHeight; }));

  // 벽에 튕기는 직선 이동을 시간만으로 계산
  const bounce = (u, R) => { if (R <= 0) return 0; const m = ((u % (2 * R)) + 2 * R) % (2 * R); return m <= R ? m : 2 * R - m; };

  function tick() {
    const W = innerWidth, H = innerHeight, t = now();
    for (const [key, w] of words) {
      const d = w.d;
      if (!d.born) continue;
      const age = Math.max(0, (t - d.born) / 1000);
      if (age >= LIFETIME) { removeWord(key); db.ref('words/' + key).remove(); continue; }
      const [sx, sy] = posOf(d.owner, d.x, d.y);
      const dist = d.speed * age;
      const wobX = Math.sin(age * 0.7 + d.wob) * 0.03, wobY = Math.cos(age * 0.9 + d.wob) * 0.03;
      const x = bounce(sx * W - w.w / 2 + (Math.cos(d.ang) * dist + wobX) * W, W - w.w);
      const y = bounce(sy * H - w.h / 2 + (Math.sin(d.ang) * dist + wobY) * H, H - w.h);
      const r = Math.sin(age * 1.3 + d.wob) * d.rot;
      w.el.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
